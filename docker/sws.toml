# static-web-server config for the Docker image. The Dockerfile appends the
# response headers from static/_headers (docker/headers.awk).
[general]
root = "/public"
# adapter-static's SPA fallback, served like not_found_handling in wrangler.jsonc
page-fallback = "/public/404.html"

# Workers' default for every asset, so static/_headers (appended below) means
# the same on both hosts. Without it static-web-server caches pages for a day
# and version.json for an hour, and installed apps keep booting the old build.
# Later entries replace a header set by an earlier one.
[[advanced.headers]]
source = "/*"
[advanced.headers.headers]
Cache-Control = "public, max-age=0, must-revalidate"
