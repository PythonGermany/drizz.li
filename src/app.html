<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Declared in the shell, not in the layout head: the SPA fallback page
		     (404.html) ships no rendered head, so without this the browser falls
		     back to requesting /favicon.ico and takes a 404 on every load of an
		     unprerendered URL. -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
		<link rel="manifest" href="/app.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="Drizz.li" />
		<!-- status bar colour = header colour; values mirror THEME_COLOR in
		     src/lib/utils/theme-color.ts -->
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1b150f" media="(prefers-color-scheme: dark)" />
		<script>
			// apply the persisted theme before first paint to avoid a flash
			try {
				var theme = JSON.parse(localStorage.getItem('theme') || '"system"');
				var dark =
					theme === 'dark' ||
					(theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
				// a theme picked in the settings overrides the media-scoped defaults
				document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
					meta.content = dark ? '#1b150f' : '#ffffff';
				});
			} catch (e) {
				/* ignore */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
